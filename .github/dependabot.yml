# Weekly update pull requests, minor and patch versions grouped per ecosystem; major versions one by
# one. Dependabot alerts and security updates are on in the repository's settings (Code security):
# an advisory brings a pull request at once, whatever the schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Node's types follow the Node version the project runs: moved by hand, with it.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # The base images, pinned by digest in both Dockerfiles.
  - package-ecosystem: docker
    directories: [/, /backend]
    schedule:
      interval: weekly
    groups:
      docker:
        update-types: [minor, patch]
    ignore:
      # A new Node major is moved to by hand, once it's LTS: Node 26's image, for one, dropped the
      # corepack the web image installs pnpm with.
      - dependency-name: node
        update-types: [version-update:semver-major]
