[project]
name = "inskect-api"
# Not the release: that comes from the Git tag, at build time (CONTRIBUTING.md#releases).
version = "0.0.0"
description = "Thin FastAPI wrapper around skillspector's scan pipeline"
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "skillspector @ git+https://github.com/NVIDIA/skillspector.git@c7958a3268d9498644b22edb75d0f051bbc8cbfc",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "cryptography>=44",
    "pyyaml>=6",
    "python-multipart>=0.0.20",
]

# Installable, for a deployment that extends the API (docs/EXTENDING.md):
#   inskect-api @ git+https://github.com/inskect/inskect.git@v1.1.0#subdirectory=backend
# installs the `app` package. This checkout runs it from source instead (package = false).
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
# skillspector is pinned to a commit of its repository.
allow-direct-references = true

[tool.uv]
package = false

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3.0",
    "pytest-random-order>=1.2.0",
    "pytest-xdist>=3.6",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
